<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KicksDB Product Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #00d4aa;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #b3b3b3;
            font-size: 1.1rem;
        }

        /* Search Section */
        .search-section {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px solid #333;
        }

        .search-form {
            display: flex;
            gap: 15px;
            align-items: end;
        }

        .input-group {
            flex: 1;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #ffffff;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: #2a2a2a;
            border: 2px solid #333;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: #00d4aa;
        }

        .search-btn {
            padding: 12px 25px;
            background: #00d4aa;
            color: #0a0a0a;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: #00b89a;
            transform: translateY(-2px);
        }

        .search-btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        /* Status Messages */
        .status {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: 600;
        }

        .status.loading {
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid #00d4aa;
            color: #00d4aa;
        }

        .status.error {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            color: #ff4444;
        }

        .status.success {
            background: rgba(0, 212, 170, 0.1);
            border: 1px solid #00d4aa;
            color: #00d4aa;
        }

        /* Product Display */
        .product-container {
            display: none;
            background: #1a1a1a;
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .product-container.show {
            display: block;
        }

        .product-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 40px;
        }

        .product-image-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .product-image {
            width: 100%;
            max-width: 400px;
            height: 300px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #333;
            background: #2a2a2a;
        }

        .product-info-section h2 {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .product-meta {
            display: grid;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background: #2a2a2a;
            border-radius: 10px;
        }

        .meta-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .meta-label {
            font-weight: 600;
            color: #b3b3b3;
        }

        .meta-value {
            color: #ffffff;
            font-weight: 500;
        }

        /* Sizes Section */
        .sizes-section h3 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .sizes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .size-button {
            padding: 15px 10px;
            background: #2a2a2a;
            border: 2px solid #333;
            border-radius: 10px;
            color: #ffffff;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .size-button:hover:not(.unavailable) {
            border-color: #00d4aa;
            background: #333;
            transform: translateY(-2px);
        }

        .size-button.selected {
            background: #00d4aa;
            border-color: #00d4aa;
            color: #0a0a0a;
            font-weight: 700;
        }

        .size-button.unavailable {
            background: #1a1a1a;
            color: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .size-text {
            font-weight: 600;
            font-size: 1rem;
        }

        .size-price {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .selected-info {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #00d4aa;
            text-align: center;
        }

        .selected-info h4 {
            color: #00d4aa;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .selected-price {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
        }

        /* Debug Console */
        .debug-console {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-top: 30px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            max-height: 400px;
            overflow-y: auto;
        }

        .debug-console h4 {
            color: #00d4aa;
            margin-bottom: 15px;
            font-family: Arial, sans-serif;
        }

        .debug-console .log-entry {
            margin-bottom: 8px;
            padding: 5px 8px;
            border-radius: 4px;
            white-space: pre-wrap;
        }

        .debug-console .log-info {
            color: #58a6ff;
            background: rgba(88, 166, 255, 0.1);
        }

        .debug-console .log-success {
            color: #56d364;
            background: rgba(86, 211, 100, 0.1);
        }

        .debug-console .log-error {
            color: #f85149;
            background: rgba(248, 81, 73, 0.1);
        }

        .debug-console .log-warning {
            color: #d29922;
            background: rgba(210, 153, 34, 0.1);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .product-layout {
                grid-template-columns: 1fr;
                gap: 30px;
                padding: 20px;
            }

            .search-form {
                flex-direction: column;
            }

            .sizes-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .product-info-section h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>KicksDB Product Viewer</h1>
            <p>Ingresa el ID del producto para cargar información en tiempo real desde KicksDB API</p>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-form">
                <div class="input-group">
                    <label for="productId">ID del Producto:</label>
                    <input 
                        type="text" 
                        id="productId" 
                        placeholder="Ej: f1938d29-48da-47eb-a5f8-619a2d8443ca"
                        value="">
                </div>
                <button class="search-btn" id="searchBtn">Buscar Producto</button>
            </div>
        </div>

        <!-- Status Messages -->
        <div id="statusContainer"></div>

        <!-- Product Container -->
        <div class="product-container" id="productContainer">
            <div class="product-layout">
                <div class="product-image-section">
                    <img id="productImage" class="product-image" alt="Product Image">
                </div>
                
                <div class="product-info-section">
                    <h2 id="productTitle">Nombre del Producto</h2>
                    
                    <div class="product-meta">
                        <div class="meta-item">
                            <span class="meta-label">ID:</span>
                            <span class="meta-value" id="productIdDisplay">-</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">SKU:</span>
                            <span class="meta-value" id="productSku">-</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Precio Base:</span>
                            <span class="meta-value" id="regularPrice">-</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Tallas Disponibles:</span>
                            <span class="meta-value" id="availableSizes">-</span>
                        </div>
                    </div>

                    <div class="sizes-section">
                        <h3>Selecciona una Talla</h3>
                        <div class="sizes-grid" id="sizesGrid">
                            <!-- Size buttons will be added here -->
                        </div>
                    </div>

                    <div class="selected-info" id="selectedInfo" style="display: none;">
                        <h4>Talla Seleccionada</h4>
                        <div class="selected-price" id="selectedPrice">$0.00</div>
                        <p id="selectedSize">-</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Debug Console -->
        <div class="debug-console">
            <h4>Debug Console</h4>
            <div id="debugLog"></div>
        </div>
    </div>

    <script>
        // Global variables para debug
        let debugLog = [];
        let currentProduct = null;
        let selectedVariant = null;

        // Función para logging con timestamps
        function log(message, type = 'info', data = null) {
            const timestamp = new Date().toISOString();
            const logEntry = {
                timestamp,
                type,
                message,
                data
            };
            
            debugLog.push(logEntry);
            console.log(`[${type.toUpperCase()}] ${timestamp}: ${message}`, data || '');
            
            // Actualizar debug console en el HTML
            updateDebugConsole();
        }

        function updateDebugConsole() {
            const debugContainer = document.getElementById('debugLog');
            const lastLogs = debugLog.slice(-20); // Solo mostrar los últimos 20 logs
            
            debugContainer.innerHTML = lastLogs.map(entry => {
                const dataStr = entry.data ? `\nData: ${JSON.stringify(entry.data, null, 2)}` : '';
                return `<div class="log-entry log-${entry.type}">
                    [${entry.timestamp.substring(11, 19)}] ${entry.message}${dataStr}
                </div>`;
            }).join('');
            
            debugContainer.scrollTop = debugContainer.scrollHeight;
        }

        function showStatus(message, type = 'info') {
            const container = document.getElementById('statusContainer');
            container.innerHTML = `<div class="status ${type}">${message}</div>`;
            
            log(`Status: ${message}`, type);
            
            if (type !== 'loading') {
                setTimeout(() => {
                    container.innerHTML = '';
                }, 5000);
            }
        }

        function formatPrice(price) {
            if (!price || price === 0) return 'No disponible';
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD'
            }).format(price);
        }

        async function searchProduct() {
            const productId = document.getElementById('productId').value.trim();
            const searchBtn = document.getElementById('searchBtn');
            
            log('Iniciando búsqueda de producto', 'info', { productId });

            if (!productId) {
                showStatus('Por favor ingresa un ID de producto', 'error');
                log('Error: ID de producto vacío', 'error');
                return;
            }

            // Deshabilitar botón y mostrar loading
            searchBtn.disabled = true;
            searchBtn.textContent = 'Buscando...';
            showStatus('Conectando con KicksDB API...', 'loading');
            
            // Ocultar producto anterior
            document.getElementById('productContainer').classList.remove('show');

            try {
                log('Construyendo URL de la API', 'info');
                const apiUrl = `/.netlify/functions/kicksdb?id=${encodeURIComponent(productId)}`;
                
                log('Enviando petición a Netlify Function', 'info', { apiUrl });

                const response = await fetch(apiUrl);
                
                log('Respuesta recibida', 'info', { 
                    status: response.status,
                    statusText: response.statusText,
                    ok: response.ok,
                    headers: Object.fromEntries(response.headers.entries())
                });

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ error: 'Unknown error' }));
                    log('Error en la respuesta de la API', 'error', { errorData });
                    throw new Error(`API Error: ${response.status} - ${errorData.message || response.statusText}`);
                }

                const data = await response.json();
                log('Datos JSON parseados exitosamente', 'success', { 
                    productId: data.id,
                    title: data.title,
                    variantsCount: data.variants?.length || 0
                });

                currentProduct = data;
                displayProduct(data);
                showStatus('Producto cargado exitosamente desde KicksDB', 'success');

            } catch (error) {
                log('Error fatal en searchProduct', 'error', { 
                    error: error.message,
                    stack: error.stack
                });
                showStatus(`Error: ${error.message}`, 'error');
                currentProduct = null;
            } finally {
                // Rehabilitar botón
                searchBtn.disabled = false;
                searchBtn.textContent = 'Buscar Producto';
            }
        }

        function displayProduct(product) {
            log('Iniciando displayProduct', 'info', { 
                productId: product.id,
                hasVariants: !!product.variants,
                variantsLength: product.variants ? product.variants.length : 0
            });

            try {
                // Actualizar información básica
                document.getElementById('productTitle').textContent = product.title || 'Sin título';
                document.getElementById('productIdDisplay').textContent = product.id;
                document.getElementById('productSku').textContent = product.sku || product.id;
                document.getElementById('regularPrice').textContent = formatPrice(product.regularPrice);
                
                // Imagen del producto
                const imageElement = document.getElementById('productImage');
                if (product.image) {
                    imageElement.src = product.image;
                    imageElement.alt = product.title || 'Imagen del producto';
                    log('Imagen del producto establecida', 'success', { imageUrl: product.image });
                } else {
                    imageElement.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNDAwIiBoZWlnaHQ9IjMwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMmEyYTJhIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxOCIgZmlsbD0iIzk5OSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPkltYWdlbiBubyBkaXNwb25pYmxlPC90ZXh0Pjwvc3ZnPg==';
                    imageElement.alt = 'Imagen no disponible';
                    log('Imagen por defecto establecida (no hay imagen en los datos)', 'warning');
                }

                // Debug de las variantes que llegan del servidor
                log('Datos de producto recibidos del servidor', 'info', {
                    productKeys: Object.keys(product),
                    hasVariants: !!product.variants,
                    variantsType: typeof product.variants,
                    variantsIsArray: Array.isArray(product.variants),
                    variantsLength: product.variants ? product.variants.length : 0,
                    variantsSample: product.variants ? product.variants.slice(0, 2) : null
                });

                // Procesar variantes/tallas
                displaySizes(product.variants || []);
                
                // Mostrar contenedor del producto
                document.getElementById('productContainer').classList.add('show');
                
                log('Producto mostrado exitosamente', 'success');

            } catch (error) {
                log('Error en displayProduct', 'error', { 
                    error: error.message,
                    productData: product
                });
                throw error;
            }
        }

        function displaySizes(variants) {
            log('Iniciando displaySizes', 'info', { variantsCount: variants.length });

            const sizesGrid = document.getElementById('sizesGrid');
            sizesGrid.innerHTML = '';

            if (!variants || variants.length === 0) {
                sizesGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #999; padding: 20px;">No hay tallas disponibles</div>';
                document.getElementById('availableSizes').textContent = '0';
                log('No hay variantes disponibles', 'warning');
                return;
            }

            let availableCount = 0;

            // Ordenar tallas numéricamente
            const sortedVariants = variants.sort((a, b) => {
                const sizeA = parseFloat(a.size) || 0;
                const sizeB = parseFloat(b.size) || 0;
                return sizeA - sizeB;
            });

            log('Variantes ordenadas', 'info', { 
                originalCount: variants.length,
                sortedCount: sortedVariants.length 
            });

            sortedVariants.forEach((variant, index) => {
                const isAvailable = variant.lowest_ask > 0 && variant.total_asks > 0;
                if (isAvailable) availableCount++;

                log(`Procesando variante ${index + 1}`, 'info', {
                    size: variant.size,
                    lowest_ask: variant.lowest_ask,
                    total_asks: variant.total_asks,
                    available: isAvailable
                });

                const sizeButton = document.createElement('div');
                sizeButton.className = `size-button ${!isAvailable ? 'unavailable' : ''}`;
                sizeButton.innerHTML = `
                    <div class="size-text">US ${variant.size}</div>
                    <div class="size-price">${formatPrice(variant.lowest_ask)}</div>
                `;

                if (isAvailable) {
                    sizeButton.addEventListener('click', () => selectSize(variant));
                    log(`Talla US ${variant.size} habilitada para selección`, 'success');
                } else {
                    sizeButton.title = 'Talla no disponible';
                    log(`Talla US ${variant.size} deshabilitada (sin stock)`, 'warning');
                }

                sizesGrid.appendChild(sizeButton);
            });

            document.getElementById('availableSizes').textContent = `${availableCount}/${variants.length}`;
            log('Tallas mostradas exitosamente', 'success', { 
                availableCount, 
                totalCount: variants.length 
            });

            // Limpiar selección previa
            selectedVariant = null;
            document.getElementById('selectedInfo').style.display = 'none';
        }

        function selectSize(variant) {
            log('Seleccionando talla', 'info', { 
                size: variant.size,
                price: variant.lowest_ask 
            });

            try {
                // Remover selección previa
                document.querySelectorAll('.size-button').forEach(btn => {
                    btn.classList.remove('selected');
                });

                // Encontrar y marcar el botón seleccionado
                const buttons = document.querySelectorAll('.size-button');
                buttons.forEach(btn => {
                    const sizeText = btn.querySelector('.size-text').textContent;
                    if (sizeText === `US ${variant.size}`) {
                        btn.classList.add('selected');
                        log('Botón de talla marcado como seleccionado', 'success');
                    }
                });

                // Actualizar información de selección
                selectedVariant = variant;
                document.getElementById('selectedSize').textContent = `Talla US ${variant.size}`;
                document.getElementById('selectedPrice').textContent = formatPrice(variant.lowest_ask);
                document.getElementById('selectedInfo').style.display = 'block';

                log('Talla seleccionada exitosamente', 'success', {
                    selectedSize: variant.size,
                    selectedPrice: variant.lowest_ask,
                    totalAsks: variant.total_asks
                });

            } catch (error) {
                log('Error al seleccionar talla', 'error', { 
                    error: error.message,
                    variant 
                });
            }
        }

        // Event Listeners
        document.getElementById('searchBtn').addEventListener('click', searchProduct);
        
        document.getElementById('productId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                log('Enter presionado en input, iniciando búsqueda', 'info');
                searchProduct();
            }
        });

        // Inicialización
        log('Aplicación inicializada correctamente', 'success', {
            timestamp: new Date().toISOString(),
            userAgent: navigator.userAgent,
            location: window.location.href
        });

        // Ejemplo de IDs para testing (puedes comentar esta parte)
        const exampleIds = [
            'f1938d29-48da-47eb-a5f8-619a2d8443ca',
            'dbb27df3-bb6e-4a7a-ba38-1bbb5f5a022a', 
            '297427c6-73bd-414f-9535-e5739c0ed93f'
        ];
        
        log('IDs de ejemplo disponibles para testing', 'info', { exampleIds });

    </script>
</body>
</html>
